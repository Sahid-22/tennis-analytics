[project]
name = "sportradar-tennis-analytics"
version = "2.0.0"
description = "Professional tennis analytics platform with Sportradar API integration, ETL pipeline, and interactive dashboard."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "SportRadar Tennis Analytics Team"}]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "altair>=5.0",
    "pandas>=2.2",
    "plotly>=5.18.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "SQLAlchemy>=2.0",
    "streamlit>=1.36",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pip-audit>=2.7",
]

[project.urls]
Repository = "https://github.com/<your-github-username>/sportradar-tennis-analytics"
Documentation = "https://github.com/<your-github-username>/sportradar-tennis-analytics#readme"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]
